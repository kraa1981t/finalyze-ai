<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FINAL RADAR V4</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#10B981" />
    <script>
      // Force Service Worker Unregister to break stale cache
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
          }
        });
      }
      // Clear cache on version change detection
      if (localStorage.getItem('app_version') !== '4.0') {
        localStorage.clear();
        localStorage.setItem('app_version', '4.0');
        alert("CRITICAL UPDATE: Radar System Active - Version 4.0");
        window.location.reload(true);
      }
      // Radical fix for persistent white screens: unregister all service workers
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (const registration of registrations) {
            registration.unregister();
            console.log('Unregistered buggy service worker');
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
