<!DOCTYPE html>
<html lang="ar">
<head><meta charset="UTF-8"><title>Finalyze Diagnostics</title>
<style>
body { font-family: monospace; background: #111; color: #eee; padding: 20px; max-width: 800px; margin: auto; }
h1 { color: #0ff; }
pre { background: #1a1a2e; padding: 10px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; }
button { background: #0ff; color: #000; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 4px; }
button.danger { background: #f44; }
.error { color: #f44; }
.success { color: #0f0; }
.info { color: #ff0; }
</style>
</head>
<body>
<h1>🔍 Finalyze Diagnostics</h1>
<div id="status">Initializing...</div>
<button onclick="checkFirestore()">🔄 Read shared_results</button>
<button class="danger" onclick="clearAll()">🗑️ Delete ALL shared_results docs</button>
<button onclick="addTestDoc()">➕ Add test document</button>
<button onclick="checkAlerts()">📢 Read shared_alerts</button>
<div id="output"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCvMayEuNTlQ5CWbjrrqw3aft_H044-uQM",
  authDomain: "trading-made-easy-e8450.firebaseapp.com",
  projectId: "trading-made-easy-e8450",
  storageBucket: "trading-made-easy-e8450.firebasestorage.app",
  messagingSenderId: "825181155493",
  appId: "1:825181155493:web:93e18f4c09033f28fb5614"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let dbInitialized = false;

function log(msg, type = 'info') {
  const el = document.getElementById('output');
  el.innerHTML += `<pre class="${type}">${msg}</pre>`;
}

async function ensureAuth() {
  if (dbInitialized) return;
  try {
    await firebase.auth().signInAnonymously();
    dbInitialized = true;
    document.getElementById('status').innerHTML = '✅ Authenticated (anonymous)';
    log('Authenticated anonymously', 'success');
  } catch (e) {
    document.getElementById('status').innerHTML = '❌ Auth failed: ' + e.message;
    log('Auth error: ' + e.message, 'error');
  }
}

async function checkFirestore() {
  await ensureAuth();
  document.getElementById('output').innerHTML = '';
  log('Reading shared_results collection (ALL docs)...');
  try {
    const snap = await db.collection('shared_results').get();
    log(`Found ${snap.size} document(s)`, 'success');
    if (snap.size > 0) {
      snap.forEach(doc => {
        const data = doc.data();
        const ts = data.timestamp;
        let tsStr = '?';
        if (ts) {
          if (typeof ts === 'string') tsStr = ts;
          else if (ts.toDate) tsStr = ts.toDate().toISOString();
          else if (ts instanceof Date) tsStr = ts.toISOString();
          else tsStr = String(ts);
        }
        log(`📄 ID: ${doc.id} | timestamp: ${tsStr} | results: ${data.results?.length ?? 0} items | email: ${data.developerEmail || '?'}`);
        if (data.results && data.results.length > 0) {
          const first = data.results[0];
          log(`   First result: ${first.symbol} | signal: ${first.signal} | confidence: ${first.confidence}`, 'info');
          const strong = data.results.filter(r => r.signal === 'strong_buy' || r.signal === 'strong_sell');
          log(`   Strong signals in this doc: ${strong.length}`, strong.length > 0 ? 'success' : 'info');
        }
      });
    }
  } catch (e) {
    log('ERROR: ' + e.message, 'error');
  }
}

async function checkAlerts() {
  await ensureAuth();
  document.getElementById('output').innerHTML = '';
  log('Reading shared_alerts collection (ALL docs)...');
  try {
    const snap = await db.collection('shared_alerts').get();
    log(`Found ${snap.size} document(s)`, 'success');
    snap.forEach(doc => {
      const data = doc.data();
      log(`📄 ID: ${doc.id} | has autoSettings: ${!!data.autoSettings} | has strategySettings: ${!!data.strategySettings}`);
    });
  } catch (e) {
    log('ERROR: ' + e.message, 'error');
  }
}

async function addTestDoc() {
  await ensureAuth();
  document.getElementById('output').innerHTML = '';
  log('Adding test document to shared_results...');
  try {
    const ref = await db.collection('shared_results').add({
      results: [{ symbol: 'TEST', signal: 'strong_buy', confidence: 99, timestamp: new Date().toISOString(), summary: 'Test signal' }],
      timestamp: firebase.firestore.FieldValue.serverTimestamp(),
      developerEmail: 'diagnostics@test.com'
    });
    log(`✅ Added test doc with ID: ${ref.id}`, 'success');
    await checkFirestore();
  } catch (e) {
    log('ERROR: ' + e.message, 'error');
  }
}

async function clearAll() {
  if (!confirm('Delete ALL shared_results documents? This cannot be undone!')) return;
  await ensureAuth();
  document.getElementById('output').innerHTML = '';
  log('Deleting ALL shared_results documents...');
  try {
    const snap = await db.collection('shared_results').get();
    let count = 0;
    const promises = [];
    snap.forEach(doc => { promises.push(doc.ref.delete()); count++; });
    await Promise.all(promises);
    log(`✅ Deleted ${count} document(s)`, 'success');
  } catch (e) {
    log('ERROR: ' + e.message, 'error');
  }
}

// Auto-run on load
window.onload = () => {
  ensureAuth().then(() => checkFirestore());
};
</script>
</body>
</html>
