  // Try collection approach: delete all then add one
  const snap = await db.collection('shared_results').orderBy('timestamp', 'desc').get();
  console.log('shared_results collection count:', snap.size);
  snap.forEach(d => console.log('  doc id:', d.id, 'results:', d.data().results?.length, 'has results:', !!d.data().results));

  }
}
