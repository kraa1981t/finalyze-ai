<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111111;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Dark background circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bg)" stroke="#333" stroke-width="2"/>
  <!-- Candlestick chart - green/red -->
  <!-- Candle 1 - Green -->
  <line x1="28" y1="28" x2="28" y2="88" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="23" y="42" width="10" height="30" rx="2" fill="#22c55e"/>
  <!-- Candle 2 - Green -->
  <line x1="46" y1="38" x2="46" y2="78" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="41" y="48" width="10" height="18" rx="2" fill="#22c55e"/>
  <!-- Candle 3 - Red -->
  <line x1="64" y1="32" x2="64" y2="82" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="59" y="38" width="10" height="26" rx="2" fill="#ef4444"/>
  <!-- Candle 4 - Green (tallest) -->
  <line x1="82" y1="22" x2="82" y2="72" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="77" y="34" width="10" height="24" rx="2" fill="#22c55e"/>
  <!-- Trend line -->
  <polyline points="28,72 46,62 64,54 82,38" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <!-- Arrow head -->
  <polygon points="82,38 76,42 78,36" fill="#ffffff" opacity="0.95"/>
  <!-- Gold accent diamond -->
  <rect x="96" y="28" width="8" height="8" rx="1" fill="#eab308" transform="rotate(45 100 32)" opacity="0.9"/>
</svg>
