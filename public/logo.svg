<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="candle1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="candle2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6EE7B7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34D399;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bg)" stroke="#fff" stroke-width="2"/>
  <!-- Candlestick chart -->
  <!-- Green candle 1 (tall) -->
  <line x1="28" y1="28" x2="28" y2="88" stroke="#A7F3D0" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="23" y="42" width="10" height="30" rx="2" fill="url(#candle1)"/>
  <!-- Green candle 2 (medium) -->
  <line x1="46" y1="38" x2="46" y2="78" stroke="#A7F3D0" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="41" y="48" width="10" height="18" rx="2" fill="url(#candle1)"/>
  <!-- Red candle -->
  <line x1="64" y1="32" x2="64" y2="82" stroke="#FCA5A5" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="59" y="38" width="10" height="26" rx="2" fill="#EF4444"/>
  <!-- Green candle 3 (tallest) -->
  <line x1="82" y1="22" x2="82" y2="72" stroke="#A7F3D0" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="77" y="34" width="10" height="24" rx="2" fill="url(#candle2)"/>
  <!-- Trend line (upward) -->
  <polyline points="28,72 46,62 64,54 82,38" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- Arrow head -->
  <polygon points="82,38 76,42 78,36" fill="#fff" opacity="0.9"/>
  <!-- Small diamond accent -->
  <rect x="96" y="28" width="8" height="8" rx="1" fill="#FBBF24" transform="rotate(45 100 32)" opacity="0.9"/>
</svg>
